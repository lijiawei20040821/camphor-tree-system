version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=sqlite:///camphor_tree.db
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    restart: unless-stopped

  # 可以添加Redis、MySQL等服务
  # redis:
  #   image: redis:alpine
  #   ports:
  #     - "6379:6379"