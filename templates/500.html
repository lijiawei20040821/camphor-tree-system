<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务器错误 - 融合机器学习的华南樟树生态因子关联解析与碳汇功能预测系统V1.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --danger: #e74c3c;
            --warning: #f39c12;
            --light-bg: #f8f9fa;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fff5f5 0%, #fff0e6 100%);
            font-family: 'Microsoft YaHei', sans-serif;
            overflow: hidden;
        }

        .error-container {
            text-align: center;
            padding: 3rem;
            position: relative;
            z-index: 1;
        }

        .error-code {
            font-size: 10rem;
            font-weight: 900;
            line-height: 1;
            /* 使用暖色调渐变，区别于404的绿色 */
            background: linear-gradient(45deg, var(--danger), var(--warning));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            margin-bottom: 1rem;
            text-shadow: 5px 5px 15px rgba(231, 76, 60, 0.1);
        }

        .error-icon {
            font-size: 8rem;
            color: var(--danger);
            opacity: 0.15;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
            animation: pulse 4s ease-in-out infinite;
        }

        .error-title {
            font-size: 2rem;
            color: var(--primary);
            margin-bottom: 1rem;
            font-weight: bold;
        }

        .error-message {
            color: #6c757d;
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }

        .btn-home {
            background: var(--primary);
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(44, 62, 80, 0.3);
        }

        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(44, 62, 80, 0.4);
            background: #34495e;
            color: white;
        }

        .btn-refresh {
            background: white;
            border: 2px solid var(--danger);
            color: var(--danger);
            padding: 10px 28px;
            border-radius: 50px;
            font-size: 1rem;
            margin-right: 15px;
            transition: all 0.3s ease;
        }

        .btn-refresh:hover {
            background: var(--danger);
            color: white;
            box-shadow: 0 5px 15px rgba(231, 76, 60, 0.2);
        }

        /* 装饰性背景圆圈 - 暖色系 */
        .bg-circle {
            position: absolute;
            border-radius: 50%;
            z-index: 0;
        }

        .circle-1 { width: 350px; height: 350px; top: -120px; left: -100px; background: rgba(231, 76, 60, 0.03); }
        .circle-2 { width: 250px; height: 250px; bottom: 20px; right: -80px; background: rgba(243, 156, 18, 0.05); }
        .circle-3 { width: 120px; height: 120px; top: 15%; right: 15%; background: rgba(231, 76, 60, 0.04); }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.15; }
            50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.2; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0.15; }
        }
    </style>
</head>
<body>
    <div class="bg-circle circle-1"></div>
    <div class="bg-circle circle-2"></div>
    <div class="bg-circle circle-3"></div>

    <div class="container">
        <div class="error-container">
            <i class="fas fa-server error-icon"></i>

            <div class="error-code">500</div>

            <h2 class="error-title">服务器遇到了一些麻烦</h2>
            <p class="error-message">
                我们的系统正在经历一场意外的“风暴”。<br>
                技术人员正在紧急抢修，请稍后重试。
            </p>

            <div class="d-flex justify-content-center">
                <button onclick="location.reload()" class="btn btn-refresh">
                    <i class="fas fa-sync-alt me-2"></i>尝试刷新
                </button>
                <a href="/dashboard" class="btn btn-home text-white">
                    <i class="fas fa-home me-2"></i>返回首页
                </a>
            </div>
        </div>
    </div>
</body>
</html>
